<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tacica Lyrics</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tacica Lyrics">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141414">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <header>
    <div id="songTitle">tacica Lyrics</div>
    <details id="menu">
      <summary>曲</summary>
      <div class="panel">
        <div id="songList"></div>
        <div id="addBox">
          <input id="urlInput" type="url" placeholder="YouTubeの動画URLを貼る">
          <button id="addBtn">追加</button>
        </div>
      </div>
    </details>
  </header>

  <div id="playerBox"><div id="player"></div></div>
  <div id="status">曲を選んでください(右上の「曲」)</div>

  <div id="stage">
    <div id="bg"></div>
    <div id="dim"></div>
    <div id="lyrics"></div>
  </div>
</div>

<script src="songs.js?v=3"></script>
<script src="lyrics.js?v=3"></script>
<script src="app.js?v=3"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
</script>
</body>
</html>
